name: RTX6000 BAR preflight test 2.6.6
on:
  workflow_dispatch:
    inputs:
      reuse_run_id:
        description: "Reuse a driver artifact with identical driver sources; leave empty for a full build"
        required: false
        default: ""
permissions:
  contents: read
  actions: read
concurrency:
  group: bar-preflight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
          fetch-depth: 2
      - name: Recover the already verified driver artifact
        if: inputs.reuse_run_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.reuse_run_id }}
          pattern: rtx6000-bar-preflight-2.6.6-*
          merge-multiple: true
          path: build-out
      - name: Verify recovered driver identity and unchanged build inputs
        if: inputs.reuse_run_id != ''
        run: |
          test "${{ inputs.reuse_run_id }}" = 41467731837
          git diff --exit-code aa37905261493814003f2b7fc27ff3f352f6d0ce HEAD -- kexts ci/build-macos-kexts.py ci/package-experiment.py ci/export-nvidia.mk ci/patches
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path('build-out')
          proof = json.loads((p / 'build-proof.json').read_text())
          assert proof['status'] == 'KEXTS_COMPILED_HARDWARE_NOT_TESTED'
          assert proof['fork_commit'] == 'aa37905261493814003f2b7fc27ff3f352f6d0ce'
          assert proof['upstream'] == 'v2.6.6'
          for line in (p / 'SHA256SUMS.txt').read_text().splitlines():
              expected, name = line.split(maxsplit=1)
              assert name == 'nullmoth-2.6.6-rtx6000-bar-preflight-v1.tar.gz'
              with (p / name).open('rb') as f:
                  assert hashlib.file_digest(f, 'sha256').hexdigest() == expected
          print('Recovered driver bytes and build sources verified; rebuilding App only')
          PY
      - name: Select matching Intel macOS toolchain
        run: |
          test "$(uname -m)" = x86_64
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          fi
          xcodebuild -version
          command -v gmake || brew install make
      - name: Test address limits and fault-inject preflight staging
        run: |
          mkdir -p build-out/logs
          set -o pipefail
          python3 ci/test-bar-preflight.py 2>&1 | tee build-out/logs/preflight-tests.log
      - name: Fetch pinned NVIDIA source and matching official patches
        if: inputs.reuse_run_id == ''
        run: |
          git clone --depth 1 --branch 615.78.08 https://github.com/NVIDIA/open-gpu-kernel-modules.git .deps/open-gpu-kernel-modules
          test "$(git -C .deps/open-gpu-kernel-modules rev-parse HEAD)" = 1a82fbfda8f321b056eb3568850f9316c5e465c5
          # 615 already guards and clears FSP pPollEvent; the old 610 FSP patch does not apply.
          git -C .deps/open-gpu-kernel-modules apply ../../ci/patches/610-macos-version-headers.patch
          git -C .deps/open-gpu-kernel-modules apply ../../ci/patches/615-display-completion.patch
          git -C .deps/open-gpu-kernel-modules apply --directory=src/nvidia-modeset ../../kexts/NVRM/patches/610-setmode-reason.patch
          git -C .deps/open-gpu-kernel-modules apply --directory=src/nvidia-modeset ../../kexts/NVRM/patches/610-backlight-register-log.patch
          git -C .deps/open-gpu-kernel-modules apply --recount --directory=src/nvidia-modeset ../../kexts/NVRM/patches/615-viewport-scaling.patch
      - name: Build and link the native Intel kexts
        if: inputs.reuse_run_id == ''
        run: python3 ci/build-macos-kexts.py --vendor .deps/open-gpu-kernel-modules --output build-out --jobs 4
      - name: Replace only NVRM in the checksum-pinned official 2.6.6 package
        if: inputs.reuse_run_id == ''
        run: python3 ci/package-experiment.py --output build-out
      - name: Build matching offline 1401 App
        run: |
          git clone --depth 1 --branch v2.6.6 https://github.com/nullmoth/1401.git .deps/1401
          test "$(git -C .deps/1401 rev-parse HEAD)" = f5a9254079601d69a2e165fcd9f659e4f882bab9
          python3 ci/package-test-app.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtx6000-bar-preflight-2.6.6-${{ github.run_number }}
          path: |
            build-out/logs/
            build-out/build-proof.json
            build-out/installer-proof.json
            build-out/SHA256SUMS.txt
            build-out/nullmoth-2.6.6-rtx6000-bar-preflight-v1.tar.gz
            build-out/1401-Mac-2.6.6-RTX6000-BAR-Preflight-Test.zip
          if-no-files-found: warn
          retention-days: 14
